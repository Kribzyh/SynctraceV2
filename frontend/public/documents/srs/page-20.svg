  <text x="80" y="380" fill="#111" font-family="Times New Roman, serif" font-size="11" font-weight="700">Use Case Description</text>
  <rect x="80" y="390" width="435" height="120" fill="none" stroke="#111"/>
  <line x1="180" y1="390" x2="180" y2="510" stroke="#111"/>
  <line x1="80" y1="420" x2="515" y2="420" stroke="#111"/>
  <line x1="80" y1="450" x2="515" y2="450" stroke="#111"/>
  <text x="90" y="410" font-size="9" font-family="Arial">Use Case Name</text>
  <text x="190" y="410" font-size="9" font-family="Arial">Authenticate User and Initialize Access</text>
  <text x="90" y="440" font-size="9" font-family="Arial">Actors</text>
  <text x="190" y="440" font-size="9" font-family="Arial">User, Google OAuth 2.0</text>
  <text x="90" y="470" font-size="9" font-family="Arial">Description</text>
  <text x="190" y="468" font-size="8" font-family="Arial">The user signs in via Google. The system validates credentials,</text>
  <text x="190" y="480" font-size="8" font-family="Arial">initializes the session, and redirects to the dashboard.</text>
  <text x="297" y="820" text-anchor="middle" fill="#999" font-size="9" font-family="Arial">Page 20</text>
